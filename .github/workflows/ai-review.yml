name: AI review

# Advisory Claude review of pull requests: inline comments plus one summary
# comment. Runs only when the ANTHROPIC_API_KEY secret is set, and never fails
# the PR (a failed review shows up as a warning on the run).
#
# Reviews when a PR is opened, reopened or marked ready. Later pushes don't
# trigger a review (each one is a billed call); add the `ai-review` label to
# review the current state again. The summary comment is updated, not repeated.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    if: >-
      ${{ !github.event.pull_request.head.repo.fork && !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - id: key
        name: Check for ANTHROPIC_API_KEY
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::ANTHROPIC_API_KEY is not set; skipping the AI review."; fi
      - if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: claude
        if: steps.key.outputs.enabled == 'true'
        # Advisory: an API outage or quota error must not block the PR.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs, security issues and
            platform-specific breakage (macOS AppleScript, Windows SMTC, Android
            Kotlin plugin, the Rust app shell and the TypeScript UI). Skip style
            nits: rustfmt, clippy and tsc already run in CI.

            Use inline comments for specific lines, and don't repeat an inline
            comment that is already on the PR. Post one short summary with
            `gh pr comment --edit-last --create-if-none`, so a re-review updates
            the previous summary. If you find nothing worth flagging, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      # continue-on-error keeps the job green, so surface the failure explicitly.
      - if: steps.claude.outcome == 'failure'
        run: |
          echo "::warning title=AI review failed::The Claude review did not complete (check that the Claude GitHub App is installed and that ANTHROPIC_API_KEY is valid and has quota). See the step log above."
