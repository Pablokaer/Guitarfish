name: CI

# Tests. Also called by release.yml, so a release is only built from a commit
# whose tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# github.workflow is the caller's name when release.yml calls this, so a release
# never shares (and cancels) the group of the push-triggered run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: App frontend (typecheck + tests + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - run: npm run build

  rust:
    # macOS runs the AppleScript parser tests; Windows compiles the SMTC code;
    # Linux compiles the MPRIS (D-Bus) code. The MPRIS mapping tests and the app
    # shell's tests (Songsterr search parsing) run everywhere.
    # Clippy also compiles both crates, so it replaces a separate `cargo check`.
    # The Android code is checked by rust-android below.
    name: Rust tests + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Tauri's Linux build dependencies (WebKitGTK, GTK, D-Bus, ...).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev patchelf build-essential file
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/plugins/tauri-plugin-nowplaying
      # tauri::generate_context! needs the built frontend (frontendDist).
      - name: Build frontend
        id: frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Plugin tests
        run: cargo test --manifest-path app/plugins/tauri-plugin-nowplaying/Cargo.toml
      - name: App shell tests
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
      # Runs even when a test fails, so one push reports both.
      - name: Clippy
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: |
          cargo clippy --manifest-path app/plugins/tauri-plugin-nowplaying/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-android:
    # Compiles and lints the #[cfg(mobile)] code, which otherwise is only built by
    # a release. `cargo clippy` doesn't link, but ring (the TLS crypto behind the
    # Songsterr search) compiles C for the target, with the runner's Android NDK.
    name: Rust clippy (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/plugins/tauri-plugin-nowplaying
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Use the runner's Android NDK for C code
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          [ -d "$ndk" ] || { echo "::error::No Android NDK found on this runner"; exit 1; }
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Clippy
        run: |
          cargo clippy --manifest-path app/plugins/tauri-plugin-nowplaying/Cargo.toml --target aarch64-linux-android --all-targets -- -D warnings
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --target aarch64-linux-android --all-targets -- -D warnings

  e2e:
    # Drives the built UI in Chromium with Tauri's IPC mocks (app/e2e/fixtures.ts).
    name: App E2E (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14
