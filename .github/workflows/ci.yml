name: CI

# Tests. Also called by release.yml, so a release is only built from a commit
# whose tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# github.workflow is the caller's name when release.yml calls this, so a release
# never shares (and cancels) the group of the push-triggered run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage

  frontend:
    name: App frontend (typecheck + tests + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - run: npm run build

  rust:
    # macOS runs the AppleScript parser tests; Windows compiles the SMTC code;
    # Linux compiles the MPRIS (D-Bus) code. The MPRIS mapping tests run everywhere.
    # Clippy also compiles both crates, so it replaces a separate `cargo check`.
    # The Android code is checked by rust-android below.
    name: Rust tests + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Tauri's Linux build dependencies (WebKitGTK, GTK, D-Bus, ...).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev patchelf build-essential file
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/plugins/tauri-plugin-nowplaying
      # tauri::generate_context! needs the built frontend (frontendDist).
      - name: Build frontend
        id: frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Plugin tests
        run: cargo test --manifest-path app/plugins/tauri-plugin-nowplaying/Cargo.toml
      # Runs even when a test fails, so one push reports both.
      - name: Clippy
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: |
          cargo clippy --manifest-path app/plugins/tauri-plugin-nowplaying/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-android:
    # Compiles and lints the #[cfg(mobile)] code, which otherwise is only built by
    # a release. `cargo clippy` doesn't link, so no NDK is needed.
    name: Rust clippy (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/plugins/tauri-plugin-nowplaying
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Clippy
        run: |
          cargo clippy --manifest-path app/plugins/tauri-plugin-nowplaying/Cargo.toml --target aarch64-linux-android --all-targets -- -D warnings
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --target aarch64-linux-android --all-targets -- -D warnings
