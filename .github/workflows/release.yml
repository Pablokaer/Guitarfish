name: Release

# Runs the tests (ci.yml) and the code review checks (code-review.yml) first; nothing is
# built or released unless both pass. Then builds installable apps and attaches
# them to a GitHub release:
#   - Windows: .msi and .exe (NSIS) installers
#   - macOS:   universal .dmg (Apple Silicon + Intel)
#   - Linux:   .AppImage and .deb (x86_64)
#   - Android: universal .apk
#
# Push a tag matching the app version (app/src-tauri/tauri.conf.json) to publish:
#   git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab: it builds into a draft release, and
# publishes it only if "publish" is ticked. "build_only" builds everything and
# keeps the installers as run artifacts, without touching any release (to test
# the pipeline, e.g. when the current version is already published).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release when every build succeeds (otherwise it stays a draft)
        type: boolean
        default: false
      build_only:
        description: Only build (installers become run artifacts; no release is created or changed)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release is only built when the tests and the code review pass on this commit.
  # Read-only tokens: these jobs install and run third-party code.
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  review:
    name: Code review
    uses: ./.github/workflows/code-review.yml
    permissions:
      contents: read

  prepare:
    name: Create draft release
    needs: [tests, review]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read app version
        run: |
          VERSION=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $VERSION in tauri.conf.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - id: release
        name: Create or reuse the draft release
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv" | head -1)
          if [ -n "$existing" ]; then
            id=$(cut -f1 <<<"$existing"); draft=$(cut -f2 <<<"$existing")
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Bump the version first: scripts/bump-version.sh <new version>"
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Guitarfish $VERSION" -F draft=true \
              -F body=@.github/release-notes.md -q .id)
            echo "Created draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macos
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
            artifact: windows
          - name: Linux
            os: ubuntu-24.04
            args: --bundles appimage,deb
            rust-targets: ""
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Tauri's Linux build dependencies. libfuse2t64 lets the AppImage tooling
      # (itself an AppImage) run on the runner. NO_STRIP: linuxdeploy's bundled
      # strip can't read some of Ubuntu 24.04's libraries and fails the bundle.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev patchelf build-essential file libfuse2t64
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      # Code signing is optional: add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as
      # repository secrets and pass them here as env to sign and notarize on macOS.
      #
      # In-app updates: the TAURI_SIGNING_* secrets sign the updater bundles
      # (.app.tar.gz, -setup.exe, .msi, .AppImage, .deb) and write a .sig next to each. Every job
      # uploads them and merges its platforms into the release's latest.json,
      # which the app's updater reads (the universal macOS build fills both
      # darwin-aarch64 and darwin-x86_64). tagName only pins the download URLs in
      # latest.json to this release; it is empty for build_only, so nothing is
      # created or uploaded then.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ !inputs.build_only && needs.prepare.outputs.tag || '' }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - if: ${{ inputs.build_only }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/msi/*.msi.sig
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/nsis/*.exe.sig
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            app/src-tauri/target/**/release/bundle/deb/*.deb
            app/src-tauri/target/**/release/bundle/deb/*.deb.sig
          if-no-files-found: error

  android:
    name: Build Android (universal APK)
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # The default list includes "tools", which no longer exists in the SDK.
          packages: platform-tools
      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      # src-tauri/gen is not committed; generate the Android project here.
      - name: Generate the Android project
        working-directory: app
        run: npx tauri android init --ci
      # The app talks to the Guitarfish server over plain HTTP on the LAN, which
      # Android release builds block by default.
      - name: Allow cleartext HTTP to the tab server
        working-directory: app/src-tauri/gen/android
        run: |
          gradle=app/build.gradle.kts
          manifest=app/src/main/AndroidManifest.xml
          if grep -q 'usesCleartextTraffic"\] = "false"' "$gradle"; then
            sed -i 's/usesCleartextTraffic"\] = "false"/usesCleartextTraffic"] = "true"/' "$gradle"
          elif ! grep -q usesCleartextTraffic "$manifest"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$manifest"
          fi
          grep -n usesCleartextTraffic "$gradle" "$manifest" || true
      - name: Build the APK
        working-directory: app
        run: npx tauri android build --apk --ci
      - name: Sign the APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*universal*release*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::No release APK found"; find app/src-tauri/gen/android/app/build/outputs -name '*.apk'; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KS_PASS="$ANDROID_KEYSTORE_PASSWORD" KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            alias="$ANDROID_KEY_ALIAS"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with a one-off key. Installs work, but updating to the next release needs an uninstall first. See README → Releases."
            export KS_PASS=ci-temporary KEY_PASS=ci-temporary
            alias=guitarfish
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Guitarfish CI"
          fi
          "$bt/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist-android
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$alias" \
            --key-pass env:KEY_PASS --out "dist-android/Guitarfish_${VERSION}_android_universal.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify "dist-android/Guitarfish_${VERSION}_android_universal.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - if: ${{ inputs.build_only }}
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist-android/*.apk
          if-no-files-found: error
      - name: Upload to the release
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          for f in dist-android/*.apk; do
            name=$(basename "$f")
            # Replace an asset left by an earlier run of the same draft.
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" -q ".[] | select(.name == \"$name\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" > /dev/null
            echo "Uploaded $name"
          done

  publish:
    name: Publish release
    needs: [prepare, desktop, android]
    if: github.event_name == 'push' || (inputs.publish && !inputs.build_only)
    runs-on: ubuntu-24.04
    steps:
      # Each desktop job merges its entry into latest.json on the draft release;
      # jobs finishing at the same moment can overwrite each other's entry. Don't
      # publish a release that installed apps couldn't update to on every platform.
      - name: Check latest.json covers every desktop platform
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" -q '.[] | select(.name == "latest.json") | .id')
          [ -n "$asset" ] || { echo "::error::latest.json is missing from the release"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          missing=$(jq -r '[ "darwin-aarch64", "darwin-x86_64", "windows-x86_64", "linux-x86_64" ] - (.platforms | to_entries
            | map(select(.value.url != "" and .value.signature != "")) | map(.key)) | join(" ")' latest.json)
          if [ -n "$missing" ]; then
            echo "::error::latest.json has no signed entry for: $missing. Re-run the failed desktop job(s) to merge them in, then re-run this job."
            exit 1
          fi
          jq -r '.platforms | keys | join(", ")' latest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true -q .html_url
