name: Code review

# Blocking review checks on every push and pull request: Rust formatting and a
# dependency audit. Clippy runs in ci.yml, where the crates are already built.
# The advisory AI review of pull requests is in ai-review.yml. Also called by
# release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# github.workflow is the caller's name when release.yml calls this (see ci.yml).
concurrency:
  group: code-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Rules are in rustfmt.toml; run `cargo fmt` before pushing.
      - run: cargo fmt --check --manifest-path app/plugins/tauri-plugin-nowplaying/Cargo.toml
      - run: cargo fmt --check --manifest-path app/src-tauri/Cargo.toml

  audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Runtime dependencies only; fails on high or critical advisories.
      - name: App
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
