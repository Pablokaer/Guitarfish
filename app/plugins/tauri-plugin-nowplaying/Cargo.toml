[package]
name = "tauri-plugin-nowplaying"
version = "0.3.0"
edition = "2021"
description = "Reads the currently playing track from the OS media session (macOS, Windows, Android)."
links = "tauri-plugin-nowplaying"
exclude = ["/android/build", "/android/.gradle"]

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# macOS: observe Spotify's PlaybackStateChanged distributed notification.
# The same versions tauri/wry already use, so nothing is built twice.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
