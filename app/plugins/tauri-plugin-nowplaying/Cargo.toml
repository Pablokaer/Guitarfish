[package]
name = "tauri-plugin-nowplaying"
version = "0.6.2"
edition = "2021"
description = "Reads the currently playing track (Spotify, YouTube, YouTube Music) from the OS (macOS, Windows, Linux, Android)."
links = "tauri-plugin-nowplaying"
exclude = ["/android/build", "/android/.gradle"]

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
# macOS: the JSON a YouTube page reports (browser.rs).
serde_json = "1"
thiserror = "2"

# macOS: observe Spotify's PlaybackStateChanged distributed notification.
# The same versions tauri/wry already use, so nothing is built twice.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
] }

# Linux and the BSDs: MPRIS over D-Bus. tauri-plugin-opener already pulls in
# zbus there, with the same version and target list.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus = "5.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
