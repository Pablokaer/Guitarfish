[package]
name = "tabsync"
version = "0.7.3"
description = "Shows the guitar tab of the song playing in Spotify."
edition = "2021"

[lib]
# staticlib/cdylib are required for the Android build.
name = "tabsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews (the in-app Songsterr panel); "protocol-asset"
# lets the music player stream local MP3 files (src/localaudio.rs opens its scope).
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-nowplaying = { path = "../plugins/tauri-plugin-nowplaying" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
# Songsterr search and key lookup (src/songsterr.rs, src/songkey.rs): rustls with ring and bundled webpki roots, so
# it needs no platform TLS or certificate store and works the same on Android.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# In-app updates (the updater has no Android support) and the music library's file
# picker. Desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

# Saving the embedded page for offline use (src/snapshot.rs) drives each platform's
# webview directly, with the same crate versions wry already uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKPDFConfiguration"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
